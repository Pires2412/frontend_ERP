<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Estoque</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <link rel="stylesheet" href="./static/css/contentArea.css">
    <link rel="stylesheet" href="./static/css/stockContent.css">
    <script src="./static/script/interactive.js" defer="defer"></script>
    <script src="./static/script/form_scripts.js" defer="defer"></script>
</head>
<nav id="menu">
    <div class="menu__item">
        <div class="menu__box"><a href="#" class="menu__iconwrapper"><img
                    src="./static/resources/images/selling_icon.svg" alt="" class="menu__icon"></a></div>
    </div>
    <div class="menu__item">
        <div class="menu__box"><a href="#" class="menu__iconwrapper"><img src="./static/resources/images/stock_icon.svg"
                    alt="" class="menu__icon"></a></div>
    </div>
    <div class="menu__item">
        <div class="menu__box"><a href="#" class="menu__iconwrapper"><img
                    src="./static/resources/images/chart_bar_icon.svg" alt="" class="menu__icon"></a></div>
    </div>
    <div class="menu__item">
        <div class="menu__box"><a href="#" class="menu__iconwrapper"><img
                    src="./static/resources/images/settings_icon.svg" alt="" class="menu__icon"></a></div>
    </div>
</nav>
<section id="contentView">
    <div class="contentwrapper  quicksearchAndForm">
        <div class="panel">
            <label class="panel__title">Busca Rápida</label>
            <div class="quicksearch">
                <input type="text" class="quicksearch__input" placeholder="digite o nome do produto">
                <button class="quicksearch__clean" style="background-color: lightgrey;">limpar</button>
            </div>
        </div>
        <div class="panel">
            <label class="panel__title">Produto</label>
            <form action="" class="form__addOrUpdate">
                <div class="form__box">
                    <label for="id">id</label>
                    <input type="text" name="id" placeholder="id" readonly="true">
                </div>
                <div class="form__box">
                    <label for="nameProduct">nome</label>
                    <input type="text" name="nameProduct" placeholder="nome">
                </div>
                <div class="form__box">
                    <label for="description">descrição</label>
                    <input type="text" name="description" placeholder="descrição">
                </div>
                <div class="form__box">
                    <label for="quantityInStock">Quantidade</label>
                    <input type="text" name="quantityInStock" placeholder="Quantidade em estoque">
                </div>
                <div class="form__box">
                    <label for="purchasePrice">valor de compra</label>
                    <input type="text" name="purchasePrice" placeholder="valor de compra">
                </div>
                <div class="form__box">
                    <label for="sellingPrice">valor de venda</label>
                    <input type="text" name="sellingPrice" placeholder="valor de venda">
                </div>
                <div class="form__box">
                    <label for="supplier">fornecedor</label>
                    <input type="text" name="supplier" placeholder="fornecedor">
                </div>
                <div class="form__box">
                    <label for="category">categoria</label>
                    <input type="text" name="category" placeholder="categoria">
                </div>
                <div class="form__box">
                    <label for="subCategory">subcategoria</label>
                    <input type="text" name="subcategory" placeholder="subcategoria">
                </div>

                <div class="buttonswrapper">
                    <button id="clearForm" class="form__button" style="background-color: lightgray;">limpar campos</button>
                    <button class="form__button" style="background-color: var(--cor-principal-media);">atualizar</button>
                    <button class="form__button" style="background-color: var(--cor-principal-escura);">novo produto</button>
                </div>

            </form>
        </div>
    </div>
    <div class="contentwrapper tableview">
        <div class="panel">
            <label class="panel__title">Produtos em estoque</label>
            <div class="tablewrapper">
                <table>
                    <colgroup>
                        <col style="width:5%;">
                        <col style="width:25%;">
                        <col style="width:5%;">
                        <col style="width: 10%;">
                        <col style="width: 10%;">
                        <col style="width: 15%;">
                        <col style="width: 15%;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Nome</th>
                            <th>Quantidade</th>
                            <th>val. compra</th>
                            <th>val. venda</th>
                            <th>Fornecedor</th>
                            <th>Categoria</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>00</td>
                            <td>teste</td>
                            <td>00</td>
                            <td>0.0</td>
                            <td>0.0</td>
                            <td>teste</td>
                            <td>teste</td>
                            <td>
                               <div class="action__container">
                                <div class="edit__container"><img src="./static/resources/images/edit_icon.svg" class="edit__icon"></div>
                                <div class="delete__container"><img src="./static/resources/images/delete_icon.svg" class="delete__icon"></div>
                               </div> 
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<body>
</body>

</html>
